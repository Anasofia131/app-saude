<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Saúde">
<meta name="theme-color" content="#f4f8fb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Saúde</title>
<style>
  :root {
    --bg: #f4f8fb; --card: #ffffff; --text: #16212b; --muted: #6b7a88;
    --water: #2f8fe0; --water-soft: #dbeafa; --line: #e3e9ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1419; --card: #1a2129; --text: #eef2f6; --muted: #93a1ae;
            --water: #4ea6f0; --water-soft: #1d3346; --line: #2a333d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 480px; margin-inline: auto;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 28px; margin: 0; }
  .date { color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 14px; }
  .ring-wrap { position: relative; width: 200px; height: 200px; margin: 0 auto 8px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-text .big { font-size: 38px; font-weight: 700; }
  .ring-text .small { color: var(--muted); font-size: 15px; }
  .status { text-align: center; color: var(--muted); font-size: 15px; min-height: 20px; }
  .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  button {
    font: inherit; border: 0; border-radius: 14px; padding: 14px 8px; cursor: pointer;
    background: var(--water-soft); color: var(--water); font-weight: 600; font-size: 16px;
  }
  button:active { transform: scale(0.97); }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row > * { flex: 1; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .log li:last-child { border-bottom: 0; }
  .log .time { color: var(--muted); }
  .empty { color: var(--muted); font-size: 15px; }
  .week { display: flex; justify-content: space-between; align-items: flex-end; height: 120px; gap: 6px; }
  .day { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; max-width: 28px; background: var(--water-soft); border-radius: 6px 6px 3px 3px; min-height: 3px; }
  .bar.hit { background: var(--water); }
  .day span { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .day b { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  label { font-size: 15px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type=number] {
    font: inherit; width: 100%; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px;
  }
  .note { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
  <header>
    <h1>Água</h1>
    <div class="date" id="today"></div>
  </header>

  <section class="card">
    <div class="ring-wrap">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="86" fill="none" stroke="var(--water-soft)" stroke-width="16"/>
        <circle id="ring" cx="100" cy="100" r="86" fill="none" stroke="var(--water)" stroke-width="16"
                stroke-linecap="round" stroke-dasharray="540.35" stroke-dashoffset="540.35"
                style="transition: stroke-dashoffset .4s ease"/>
      </svg>
      <div class="ring-text">
        <div class="big" id="total">0 ml</div>
        <div class="small" id="goalText">de 2000 ml</div>
      </div>
    </div>
    <div class="status" id="status"></div>
    <div class="buttons">
      <button data-ml="200">+200 ml</button>
      <button data-ml="330">+330 ml</button>
      <button data-ml="500">+500 ml</button>
    </div>
    <div class="row">
      <button class="secondary" id="custom">Outra quantidade</button>
      <button class="secondary" id="undo">Desfazer</button>
    </div>
  </section>

  <section class="card">
    <h2>Hoje</h2>
    <ul class="log" id="log"></ul>
  </section>

  <section class="card">
    <h2>Últimos 7 dias</h2>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <h2>Definições</h2>
    <label for="goal">Objetivo diário (ml)</label>
    <input type="number" id="goal" inputmode="numeric" min="250" step="250">
    <div class="row">
      <button class="secondary" id="export">Exportar cópia</button>
      <button class="secondary" id="import">Importar cópia</button>
    </div>
    <input type="file" id="importFile" accept="application/json" hidden>
    <p class="note">Os dados ficam só neste telemóvel. Exporta uma cópia de vez em quando, por segurança.</p>
  </section>

<script>
const KEY = 'saude-v1';
const load = () => {
  try { return JSON.parse(localStorage.getItem(KEY)) || { goal: 2000, water: {} }; }
  catch { return { goal: 2000, water: {} }; }
};
let data = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };

const dayKey = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const entries = (k = dayKey()) => data.water[k] || [];
const sum = (k) => entries(k).reduce((a, e) => a + e.ml, 0);

function add(ml) {
  if (!ml || ml <= 0) return;
  const k = dayKey();
  (data.water[k] ||= []).push({ ml, t: Date.now() });
  save(); render();
}

function render() {
  const k = dayKey();
  const total = sum(k);
  const pct = Math.min(total / data.goal, 1);
  document.getElementById('today').textContent =
    new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('total').textContent = `${total} ml`;
  document.getElementById('goalText').textContent = `de ${data.goal} ml`;
  document.getElementById('ring').style.strokeDashoffset = 540.35 * (1 - pct);
  const left = data.goal - total;
  document.getElementById('status').textContent =
    left > 0 ? `Faltam ${left} ml` : 'Objetivo cumprido 💧';
  document.getElementById('goal').value = data.goal;

  const log = document.getElementById('log');
  const list = entries(k).slice().reverse();
  log.innerHTML = list.length ? '' : '<li class="empty">Ainda sem registos hoje.</li>';
  for (const e of list) {
    const li = document.createElement('li');
    const time = new Date(e.t).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
    li.innerHTML = `<span class="time">${time}</span><span>${e.ml} ml</span>`;
    log.appendChild(li);
  }

  const week = document.getElementById('week');
  week.innerHTML = '';
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const max = Math.max(data.goal, ...days.map(d => sum(dayKey(d))));
  for (const d of days) {
    const v = sum(dayKey(d));
    const col = document.createElement('div');
    col.className = 'day';
    const h = Math.round((v / max) * 85);
    col.innerHTML = `<b>${v ? (v / 1000).toFixed(1) : ''}</b>
      <div class="bar ${v >= data.goal ? 'hit' : ''}" style="height:${h}%"></div>
      <span>${d.toLocaleDateString('pt-PT', { weekday: 'short' }).slice(0, 3)}</span>`;
    week.appendChild(col);
  }
}

document.querySelectorAll('[data-ml]').forEach(b =>
  b.addEventListener('click', () => add(Number(b.dataset.ml))));
document.getElementById('custom').addEventListener('click', () => {
  const v = Number(prompt('Quantos ml?', '250'));
  if (v > 0 && v < 5000) add(Math.round(v));
});
document.getElementById('undo').addEventListener('click', () => {
  const k = dayKey();
  if (entries(k).length) { data.water[k].pop(); save(); render(); }
});
document.getElementById('goal').addEventListener('change', e => {
  const v = Math.round(Number(e.target.value));
  if (v >= 250 && v <= 10000) { data.goal = v; save(); }
  render();
});
document.getElementById('export').addEventListener('click', async () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const file = new File([blob], `saude-copia-${dayKey()}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch {}
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
});
document.getElementById('import').addEventListener('click', () =>
  document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d && typeof d.goal === 'number' && d.water) {
      if (confirm('Substituir os dados atuais pela cópia?')) { data = d; save(); render(); }
    } else alert('Ficheiro inválido.');
  } catch { alert('Não foi possível ler o ficheiro.'); }
  e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
